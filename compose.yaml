services:
  mysql:
    image: mysql:8.4.0
    container_name: codex-hibernate-evaluation-mysql
    ports:
      - "127.0.0.1:3318:3306"
    environment:
      MYSQL_ROOT_PASSWORD: labroot
      MYSQL_DATABASE: hibernate_evaluation
      MYSQL_USER: lab
      MYSQL_PASSWORD: labpass
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-plabroot"]
      interval: 3s
      timeout: 3s
      retries: 30
